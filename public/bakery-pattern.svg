<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Seamless Pattern Definition -->
    <pattern id="bakeryPattern" x="0" y="0" width="400" height="400" patternUnits="userSpaceOnUse">
      
      <!-- 1. Top Left: Layered Cake with 3 Candles -->
      <g transform="translate(40, 30) scale(0.8)" stroke="#E0E0E0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Cake Base & Layers -->
        <path d="M 10,50 Q 50,70 90,50 L 90,90 Q 50,110 10,90 Z" />
        <path d="M 10,70 Q 50,90 90,70" />
        <path d="M 10,50 Q 50,30 90,50" />
        <!-- Drips -->
        <path d="M 10,50 Q 20,62 30,52 Q 40,65 50,52 Q 60,62 70,52 Q 80,65 90,50" />
        <!-- Candles -->
        <line x1="30" y1="20" x2="30" y2="38" />
        <path d="M 30,12 Q 26,16 30,20 Q 34,16 30,12 Z" fill="#E0E0E0" />
        <line x1="50" y1="15" x2="50" y2="36" />
        <path d="M 50,7 Q 46,11 50,15 Q 54,11 50,7 Z" fill="#E0E0E0" />
        <line x1="70" y1="20" x2="70" y2="38" />
        <path d="M 70,12 Q 66,16 70,20 Q 74,16 70,12 Z" fill="#E0E0E0" />
      </g>

      <!-- 2. Center Top: 2-Tier Birthday Cake with Sparkler -->
      <g transform="translate(180, 100) scale(0.7)" stroke="#E0E0E0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Bottom Tier -->
        <path d="M 10,60 Q 50,75 90,60 L 90,95 Q 50,110 10,95 Z" />
        <path d="M 10,60 Q 50,45 90,60" />
        <!-- Top Tier -->
        <path d="M 25,30 Q 50,42 75,30 L 75,52 Q 50,64 25,52 Z" />
        <path d="M 25,30 Q 50,18 75,30" />
        <!-- Candle & Sparkler -->
        <line x1="42" y1="6" x2="42" y2="22" />
        <path d="M 42,0 Q 39,3 42,6 Q 45,3 42,0 Z" fill="#E0E0E0" />
        <line x1="58" y1="2" x2="58" y2="24" />
        <!-- Sparkle Lines -->
        <line x1="58" y1="-4" x2="58" y2="-1" />
        <line x1="53" y1="0" x2="55" y2="2" />
        <line x1="63" y1="0" x2="61" y2="2" />
      </g>

      <!-- 3. Top Right: Slice of Cake on Plate -->
      <g transform="translate(270, 40) scale(0.85)" stroke="#E0E0E0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Plate -->
        <ellipse cx="65" cy="85" rx="55" ry="20" />
        <ellipse cx="65" cy="85" rx="45" ry="14" stroke-dasharray="4,4" />
        <!-- Cake Slice Body -->
        <path d="M 30,55 L 85,25 L 110,48 L 50,80 Z" />
        <path d="M 110,48 L 110,68 L 50,98 L 50,80" />
        <path d="M 30,55 L 30,75 L 50,98" />
        <!-- Inner Layers -->
        <path d="M 30,62 L 85,32 L 110,55" />
        <path d="M 30,69 L 85,39 L 110,62" />
        <!-- Cherry on Top -->
        <circle cx="80" cy="20" r="6" fill="#E0E0E0" />
        <path d="M 82,14 Q 90,5 98,10" />
      </g>

      <!-- 4. Bottom Left: Glazed Donut -->
      <g transform="translate(50, 270) scale(0.85)" stroke="#E0E0E0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Outer Body -->
        <ellipse cx="50" cy="50" rx="42" ry="38" />
        <!-- Inner Hole -->
        <ellipse cx="50" cy="48" rx="14" ry="12" />
        <!-- Icing Line -->
        <path d="M 12,45 Q 22,58 32,48 Q 42,60 52,50 Q 62,62 72,50 Q 82,58 88,42" />
        <!-- Sprinkles -->
        <line x1="26" y1="26" x2="32" y2="28" />
        <line x1="65" y1="25" x2="70" y2="30" />
        <line x1="30" y1="40" x2="34" y2="44" />
        <line x1="68" y1="42" x2="74" y2="40" />
        <line x1="45" y1="20" x2="52" y2="21" />
      </g>

      <!-- 5. Bottom Right: Stack of Chocolate Chip Cookies -->
      <g transform="translate(280, 260) scale(0.85)" stroke="#E0E0E0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Bottom Cookie -->
        <path d="M 10,80 Q 50,98 90,80 Q 95,95 50,105 Q 5,95 10,80 Z" />
        <!-- Middle Cookie -->
        <path d="M 8,55 Q 50,73 92,55 Q 96,72 50,80 Q 4,72 8,55 Z" />
        <!-- Top Cookie -->
        <ellipse cx="50" cy="38" rx="42" ry="20" />
        
        <!-- Choco Chips on Top Cookie -->
        <path d="M 25,32 Q 28,28 32,32 Q 28,36 25,32 Z" fill="#E0E0E0" />
        <path d="M 45,28 Q 48,24 52,28 Q 48,32 45,28 Z" fill="#E0E0E0" />
        <path d="M 65,34 Q 68,30 72,34 Q 68,38 65,34 Z" fill="#E0E0E0" />
        <path d="M 35,42 Q 38,38 42,42 Q 38,46 35,42 Z" fill="#E0E0E0" />
        <path d="M 58,44 Q 61,40 65,44 Q 61,48 58,44 Z" fill="#E0E0E0" />

        <!-- Choco Chips on Middle Cookie -->
        <path d="M 25,62 Q 28,58 31,62 Z" fill="#E0E0E0" />
        <path d="M 50,66 Q 53,62 56,66 Z" fill="#E0E0E0" />
        <path d="M 72,61 Q 75,57 78,61 Z" fill="#E0E0E0" />
      </g>

    </pattern>
  </defs>

  <!-- Dark Background -->
  <rect width="100%" height="100%" fill="#0D0D0D" />
  
  <!-- Pattern Overlay -->
  <rect width="100%" height="100%" fill="url(#bakeryPattern)" />
</svg>
